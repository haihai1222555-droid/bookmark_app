services:
  - type: web
    name: my-bookmark
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: my_bookmark
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: true
