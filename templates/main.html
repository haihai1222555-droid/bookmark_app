<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 북마크</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main-box">
        <h1>나만의 북마크</h1>
        <p class="user-area">{{ user_name }}님 / <a href="{{ url_for('logout') }}">로그아웃</a></p>
        <hr>

        <div class="search-area">
            <input type="text" id="search-keyword" class="form-control" placeholder="제목 검색">
            <button id="search-button" class="btn btn-secondary">검색</button>
        </div>

        <button id="show-add-form" class="btn btn-primary add-button">북마크 추가</button>

        <div id="add-form" class="add-form d-none">
            <p><b>새 북마크</b></p>
            <input type="text" id="new-title" class="form-control" placeholder="제목">
            <input type="url" id="new-url" class="form-control" placeholder="https://example.com">
            <button id="create-button" class="btn btn-primary small-button">저장</button>
            <button id="cancel-add-button" class="btn btn-secondary small-button">취소</button>
        </div>

        <div id="edit-form" class="add-form mb-3 d-none">
            <h5>북마크 수정</h5>
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-title" class="form-control mb-2" placeholder="수정할 제목">
            <input type="url" id="edit-url" class="form-control mb-2" placeholder="수정할 URL">
            <button class="btn btn-primary btn-sm" id="save-edit-button">수정완료</button>
            <button class="btn btn-secondary btn-sm" id="cancel-edit-button">취소</button>
        </div>

        <div id="bookmark-list">
            {% for bookmark in bookmarks %}
            <div class="bookmark-item" data-id="{{ bookmark.id }}">
                <button type="button" class="title-button">
                    <span class="arrow">▶</span>
                    <span class="title-text">{{ bookmark.title }}</span>
                </button>
                <div class="bookmark-detail d-none">
                    <p>주소 : <a class="url-link" href="{{ bookmark.url }}" target="_blank" rel="noopener noreferrer">{{ bookmark.url }}</a></p>
                    <button class="btn btn-secondary btn-sm edit-button">수정</button>
                    <button class="btn btn-danger btn-sm delete-button">삭제</button>
                </div>
            </div>
            {% else %}
            <p class="empty-message">저장한 북마크가 없습니다.</p>
            {% endfor %}
        </div>
    </div> 

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <script>
                alert("{{messages[0]}}");
            </script>
        {% endif %}
    {% endwith %}
</body>
</html>
