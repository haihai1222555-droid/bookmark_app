<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-box">
        <h1>아이디 찾기</h1>
        <hr>
        <form id="find-id-form">
            <p>사용자 이름</p>
            <input type="text" id="user_name" class="form-control mb-3" placeholder="사용자 이름" required>

            <p class="input-title">이메일</p>
            <input type="email" id="email" class="form-control" placeholder="example@gmail.com" required>
            <button type="button" id="send-code-button" class="btn btn-secondary small-button">인증번호 전송</button>
            <p id="email-message" class="check-message"></p>

            <div id="code-area" class="d-none">
                <p class="input-title">
                    인증번호 (6자리)
                    <span id="timer" style="color: red; font-weight: bold; margin-left: 10px;">10:00</span>
                </p>
                <input type="text" id="auth_code" class="form-control" placeholder="6자리 숫자 입력">
                <button type="button" id="verify-code-button" class="btn btn-primary small-button">인증 확인</button>
                <p id="code-message" class="check-message"></p>      
            </div>

            <div id="result-box" class="d-none mt-3 p-3 text-center" style="background-color: #f8f9fa; border: 1px solid #ddd; border-radius: 5px;">
                <p class="mb-1" style="color: #555;">회원님의 아이디는</p>
                <h4 id="found-id" style="color: #0d6efd; font-weight: bold;"></h4>
            </div>

            <button type="submit" id="find-btn" class="btn btn-primary login-button mt-3">아이디 찾기</button>
        </form>
        <p class="bottom-link mt-3"><a href="{{url_for('login')}}">로그인으로 돌아가기</a></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        var emailVerified = false;
        var resendTimer = null;
        var expireTimer = null;

         $('#send-code-button').click(function () {
            let email = $('#email').val();

            if (!email) {
                alert('이메일을 입력해주세요.');
                return;
            }

            let sendBtn = $('#send-code-button');
            sendBtn.attr('disabled', true)
            let resendLeft = 60;

            clearInterval(resendTimer);
            resendTimer = setInterval(function () {
                resendLeft--;
                sendBtn.text(`재전송 (${resendLeft}초)`);

                if (resendLeft <= 0) {
                    clearInterval(resendTimer);
                    sendBtn.attr('disabled', false).text('인증번호 재전송');
                }
            }, 1000);

            $('#email-message').text('인증번호 발송 중입니다. 잠시만 기다려주세요.').css('color', 'blue');

            $.ajax({
                type: 'POST',
                url: '/api/send-email-code',
                data: { email: email },
                success: function (res) {
                    $('#email-message').text(res.message).css('color', 'green');
                    $('#code-area').removeClass('d-none');

                    let expireLeft = 600;
                    clearInterval(expireTimer);
                    expireTimer = setInterval(function () {
                        expireLeft--;
                        let min = Math.floor(expireLeft / 60);
                        let sec = expireLeft % 60;

                        $('#timer').text(`${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`);

                        if (expireLeft <= 0){
                            clearInterval(expireTimer);
                            $('#timer').text('시간 만료');
                            $('#code-message').text('인증시간이 만료되었습니다. 다시 발송해주세요.').css('color', 'red');
                        }
                    }, 1000);
                },
                error: function (xhr) {
                    $('#email-message').text(xhr.responseJSON.message).css('color', 'red');
                    clearInterval(resendTimer);
                    sendBtn.attr('disabled', false).text('인증번호 발송');
                }
            });
        });

        $('#verify-code-button').click(function () {
            let code = $('#auth_code').val();
            if (!code) {
                alert('인증번호를 입력해주세요.')
                return;
            }

            $.ajax({
                type: 'POST',
                url: '/api/verify-email-code',
                data: { code: code },
                success: function (res) {
                    emailVerified = true;
                    clearInterval(expireTimer);
                    $('#timer').text('');
                    $('#code-message').text(res.message).css('color', 'green');
                    $('#email').attr('readonly', true);
                    $('#auth_code').attr('readonly', true);
                    $('#send-code-button').attr('disabled', true);
                },
                error: function (xhr) {
                    emailVerified = false;
                    if(xhr.responseJSON){
                        $('#code-message').text(xhr.responseJSON.message).css('color', 'red');
                    }
                }
            });
        });

        $('#find-id-form').submit(function (event){
            event.preventDefault();

            if (!emailVerified){
                alert('이메일 인증을 먼저 완료해주세요.')
                return;
            }

            let user_name = $('#user_name').val().trim();
            let email = $('#email').val();

            $.ajax({
                type: 'POST',
                url: '/api/find-id',
                data: {user_name: user_name, email: email},
                success: function (res){
                    $('#found-id').text(res.user_id);
                    $('#result-box').removeClass('d-none');
                    $('#find-btn').attr('disabled', true);
                },
                error: function (xhr){
                    alert(xhr.responseJSON ? xhr.responseJSON.message : '아이디를 찾을 수 없습니다.');
                }
            });
        });
    </script>
</body>
