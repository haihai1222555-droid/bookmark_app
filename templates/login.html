<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-box">
        <h1>나만의 북마크</h1>
        <hr>
        <form method="POST">
            <p>ID, 사용자 이름 또는 이메일</p>
            <input type="text" name="user_id" class="form-control" required>

            <p class="input-title">PW</p>
            <input type="password" name="password" class="form-control" required>

            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}

            <button type="submit" class="btn btn-primary login-button">로그인</button>
        </form>
        <p class="bottom-link">
            <a href="{{ url_for('find_id')}}">아이디 찾기</a> |
            <a href="{{ url_for('reset_password')}}">비밀번호 찾기</a> |
            <a href="{{ url_for('signup')}}">회원가입</a>
        </p>
    </div>
</body>
</html>
